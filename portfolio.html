<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio - ศุภวิชญ์ พุ่มพฤกษ์</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: linear-gradient(
                135deg,
                #111827,
                #1e293b,
                #312e81
            );
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 45px;
            backdrop-filter: blur(15px);
            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile {
            width: 120px;
            height: 120px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #818cf8,
                #c084fc
            );

            font-size: 45px;
            font-weight: bold;

            box-shadow:
                0 10px 30px
                rgba(129, 140, 248, 0.4);
        }

        h1 {
            margin: 20px 0 5px;
            font-size: 36px;
        }

        .subtitle {
            color: #c7d2fe;
            font-size: 17px;
        }

        .title {
            font-size: 24px;
            margin-bottom: 25px;
            color: #c4b5fd;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .label {
            font-size: 13px;
            color: #a5b4fc;
            margin-bottom: 6px;
        }

        .value {
            font-size: 17px;
        }

        .email {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 15px;
        }

        .back-button {
            display: block;
            width: fit-content;

            margin: 30px auto 0;
            padding: 14px 25px;

            border-radius: 12px;

            background: #6366f1;
            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;

            transition: 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            background: #818cf8;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #cbd5e1;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .info {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="profile">
                SP
            </div>

            <h1>
                ศุภวิชญ์ พุ่มพฤกษ์
            </h1>

            <div class="subtitle">
                Computer Science Student
            </div>

        </div>


        <div class="title">
            ABOUT ME
        </div>


        <div class="info">

            <div class="info-box">

                <div class="label">
                    ชื่อ - นามสกุล
                </div>

                <div class="value">
                    ศุภวิชญ์ พุ่มพฤกษ์
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    รหัสนิสิต
                </div>

                <div class="value">
                    6721601508
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    หมู่
                </div>

                <div class="value">
                    700
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    ชั้นปีที่
                </div>

                <div class="value">
                    3
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    สถานศึกษา
                </div>

                <div class="value">
                    มหาวิทยาลัยเกษตรศาสตร์<br>
                    วิทยาเขตกำแพงแสน
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    คณะ
                </div>

                <div class="value">
                    ศิลปศาสตร์และวิทยาศาสตร์
                </div>

            </div>


            <div class="info-box">

                <div class="label">
                    สาขา
                </div>

                <div class="value">
                    วิทยาการคอมพิวเตอร์
                </div>

            </div>

        </div>


        <div class="email">

            <div class="label">
                EMAIL
            </div>

            <div class="value">
                supawit.phu@ku.th
            </div>

        </div>


        <!-- ปุ่มกลับหน้า 3D -->
        <a
            href="index.html"
            class="back-button"
        >
            ← BACK TO 3D
        </a>


        <div class="footer">
            3D Interactive Portfolio
        </div>

    </div>

</div>

</body>
</html>
