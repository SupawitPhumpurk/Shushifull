<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model - Shushi</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Sarabun', 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ข้อความด้านบน */
        #hint {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            background: rgba(0,0,0,0.35);
            padding: 8px 14px;
            border-radius: 8px;
        }

        /* Debug */
        #debugBox {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 30;
            display: none;
        }
    </style>
</head>

<body>

    <div id="hint">
        คลิก Menu / About Me / Photo เพื่อดูโมเดล
    </div>

    <div id="debugBox"></div>


    <!-- ============================================================
         Three.js
    ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>


    <script>

        /* ============================================================
           ตั้งค่า
        ============================================================ */

        const CURTAIN_OBJECT_NAMES = [
            "Plane011"
        ];


        /* ============================================================
           ข้อมูล Portfolio
        ============================================================ */

        const portfolioData = {

            name: "ศุภวิชญ์ พุ่มพฤกษ์",

            studentId: "6721601508",

            major: "วิทยาการคอมพิวเตอร์",

            faculty: "ศิลปศาสตร์และวิทยาศาสตร์",

            bio: "เนื้อหา portfolio (ผลงาน / โปรเจกต์) จะเพิ่มเติมภายหลัง"

        };


        /* ============================================================
           Scene
        ============================================================ */

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x1a1a1a);


        /* ============================================================
           Camera
        ============================================================ */

        const camera =
            new THREE.PerspectiveCamera(

                45,

                window.innerWidth /
                window.innerHeight,

                0.01,

                1000

            );


        /* ============================================================
           Renderer
        ============================================================ */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            window.devicePixelRatio

        );


        renderer.outputEncoding =
            THREE.sRGBEncoding;


        document.body.appendChild(
            renderer.domElement
        );


        /* ============================================================
           Orbit Controls
        ============================================================ */

        const controls =
            new THREE.OrbitControls(

                camera,

                renderer.domElement

            );


        controls.enableDamping = true;


        /* ============================================================
           แสง
        ============================================================ */

        const ambientLight =
            new THREE.AmbientLight(

                0xffffff,

                1.0

            );


        scene.add(
            ambientLight
        );


        const directionalLight =
            new THREE.DirectionalLight(

                0xffffff,

                1.2

            );


        directionalLight.position.set(

            0,

            10,

            10

        );


        scene.add(
            directionalLight
        );


        /* ============================================================
           Toon Gradient
        ============================================================ */

        function createToonGradientTexture() {

            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width = 4;

            canvas.height = 1;


            const ctx =
                canvas.getContext('2d');


            const shades = [

                80,

                140,

                190,

                255

            ];


            shades.forEach(

                (v, i) => {

                    ctx.fillStyle =
                        `rgb(${v},${v},${v})`;


                    ctx.fillRect(

                        i,

                        0,

                        1,

                        1

                    );

                }

            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            texture.minFilter =
                THREE.NearestFilter;


            texture.magFilter =
                THREE.NearestFilter;


            texture.generateMipmaps =
                false;


            return texture;

        }


        const toonGradientMap =
            createToonGradientTexture();


        /* ============================================================
           ตัวแปร Object
        ============================================================ */

        let modelRoot = null;


        /* ปุ่ม 3 จุด */

        let menuButtonObj = null;

        let aboutButtonObj = null;

        let photoButtonObj = null;


        /* จุด Target */

        let menuTargetObj = null;

        let aboutTargetObj = null;

        let photoTargetObj = null;


        /* ตำแหน่งกล้องเดิม */

        let defaultCamPos =
            new THREE.Vector3();


        let defaultCamTarget =
            new THREE.Vector3();


        /* กำลังดูจุดพิเศษอยู่หรือไม่ */

        let viewingMode = false;


        /* Shader ผ้าม่าน */

        const curtainShaders = [];


        const clock =
            new THREE.Clock();


        /* ============================================================
           โหลดโมเดล
        ============================================================ */

        const loader =
            new THREE.GLTFLoader();


        const dracoLoader =
            new THREE.DRACOLoader();


        dracoLoader.setDecoderPath(

            'https://www.gstatic.com/draco/versioned/decoders/1.5.6/'

        );


        loader.setDRACOLoader(
            dracoLoader
        );


        loader.load(

            'https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=',


            (gltf) => {

                const model =
                    gltf.scene;


                modelRoot =
                    model;


                /* หมุนโมเดล */

                model.rotation.y =
                    -Math.PI / 2;


                /* รายชื่อ Mesh */

                const allMeshNames = [];


                /* ====================================================
                   Traverse
                ==================================================== */

                model.traverse(

                    (node) => {

                        if (!node.isMesh)
                            return;


                        allMeshNames.push(
                            node.name
                        );


                        /* Material เดิม */

                        const originalMap =
                            node.material
                                ? node.material.map
                                : null;


                        const originalColor =
                            node.material &&
                            node.material.color

                                ? node.material.color.clone()

                                : new THREE.Color(
                                    0xffffff
                                );


                        /* =================================================
                           Cylinder
                        ================================================= */

                        if (

                            node.name.startsWith(
                                'Cylinder'
                            )

                        ) {

                            node.material =
                                new THREE.MeshStandardMaterial({

                                    map:
                                        originalMap,

                                    color:
                                        originalColor,

                                    metalness:
                                        0.85,

                                    roughness:
                                        0.25

                                });

                        }


                        /* =================================================
                           Icosphere
                        ================================================= */

                        if (

                            node.name.startsWith(
                                'Icosphere'
                            )

                        ) {

                            node.material =
                                new THREE.MeshToonMaterial({

                                    map:
                                        originalMap,

                                    color:
                                        originalColor,

                                    gradientMap:
                                        toonGradientMap

                                });

                        }


                        /* =================================================
                           ปุ่ม Menu
                        ================================================= */

                        if (

                            node.name ===
                            'Plane025'

                        ) {

                            menuButtonObj =
                                node;

                        }


                        /* =================================================
                           ปุ่ม About Me
                        ================================================= */

                        if (

                            node.name ===
                            'Plane026'

                        ) {

                            aboutButtonObj =
                                node;

                        }


                        /* =================================================
                           ปุ่ม Photo
                        ================================================= */

                        if (

                            node.name ===
                            'Plane027'

                        ) {

                            photoButtonObj =
                                node;

                        }


                        /* =================================================
                           Target Menu
                        ================================================= */

                        if (

                            node.name ===
                            'Plane016'

                        ) {

                            menuTargetObj =
                                node;

                        }


                        /* =================================================
                           Target About
                        ================================================= */

                        if (

                            node.name ===
                            'Plane017'

                        ) {

                            aboutTargetObj =
                                node;

                        }


                        /* =================================================
                           Target Photo
                        ================================================= */

                        if (

                            node.name ===
                            'Plane024'

                        ) {

                            photoTargetObj =
                                node;

                        }


                        /* =================================================
                           Shader ผ้าม่าน
                        ================================================= */

                        if (

                            CURTAIN_OBJECT_NAMES.includes(
                                node.name
                            )

                        ) {

                            node.material.onBeforeCompile =
                                (shader) => {

                                    shader.uniforms.uTime = {
                                        value: 0
                                    };


                                    shader.vertexShader =
                                        'uniform float uTime;\n' +
                                        shader.vertexShader;


                                    shader.vertexShader =
                                        shader.vertexShader.replace(

                                            '#include <begin_vertex>',

                                            `

                                            #include <begin_vertex>

                                            float waveStrength = 0.04;

                                            float waveSpeed = 2.0;

                                            float waveFreq = 6.0;

                                            float hangFactor =
                                                clamp(
                                                    1.0 -
                                                    (position.y + 1.0),
                                                    0.0,
                                                    1.0
                                                );


                                            transformed.x +=

                                                sin(

                                                    position.y *
                                                    waveFreq +

                                                    uTime *
                                                    waveSpeed

                                                )

                                                *

                                                waveStrength

                                                *

                                                hangFactor;


                                            transformed.z +=

                                                cos(

                                                    position.y *
                                                    waveFreq *
                                                    0.7 +

                                                    uTime *
                                                    waveSpeed

                                                )

                                                *

                                                waveStrength *

                                                0.5 *

                                                hangFactor;

                                            `

                                        );


                                    curtainShaders.push(
                                        shader
                                    );

                                };


                            node.material.needsUpdate =
                                true;

                        }

                    }

                );


                /* ====================================================
                   จัดขนาดโมเดล
                ==================================================== */

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            model
                        );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                model.position.sub(
                    center
                );


                /* ====================================================
                   คำนวณระยะกล้อง
                ==================================================== */

                const maxDim =
                    Math.max(

                        size.x,

                        size.y,

                        size.z

                    );


                const fov =
                    camera.fov *
                    (Math.PI / 180);


                let cameraZ =
                    Math.abs(

                        maxDim /

                        (
                            2 *
                            Math.tan(
                                fov / 2
                            )
                        )

                    );


                cameraZ *= 1.35;


                camera.position.set(

                    0,

                    0,

                    cameraZ

                );


                controls.target.set(

                    0,

                    0,

                    0

                );


                controls.update();


                /* ====================================================
                   จำตำแหน่งกล้องเดิม
                ==================================================== */

                defaultCamPos.copy(
                    camera.position
                );


                defaultCamTarget.copy(
                    controls.target
                );


                scene.add(
                    model
                );


                /* ====================================================
                   Debug Console
                ==================================================== */

                console.log(
                    'รายชื่อ Mesh:',
                    allMeshNames
                );


                console.log(
                    'Menu:',
                    menuButtonObj
                        ? menuButtonObj.name
                        : 'ไม่เจอ'
                );


                console.log(
                    'About:',
                    aboutButtonObj
                        ? aboutButtonObj.name
                        : 'ไม่เจอ'
                );


                console.log(
                    'Photo:',
                    photoButtonObj
                        ? photoButtonObj.name
                        : 'ไม่เจอ'
                );


                console.log(
                    'Menu Target:',
                    menuTargetObj
                        ? menuTargetObj.name
                        : 'ไม่เจอ'
                );


                console.log(
                    'About Target:',
                    aboutTargetObj
                        ? aboutTargetObj.name
                        : 'ไม่เจอ'
                );


                console.log(
                    'Photo Target:',
                    photoTargetObj
                        ? photoTargetObj.name
                        : 'ไม่เจอ'
                );


                if (

                    !menuButtonObj ||

                    !aboutButtonObj ||

                    !photoButtonObj

                ) {

                    document.getElementById(
                        'hint'
                    ).innerText =

                        'บางปุ่มยังไม่เจอ object ในโมเดล — เปิด Console (F12) ดูรายชื่อทั้งหมด';

                }

            },


            undefined,


            (error) => {

                console.error(

                    'เกิดข้อผิดพลาดในการโหลดโมเดล:',

                    error

                );

            }

        );


        /* ============================================================
           Raycaster
        ============================================================ */

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();


        /* ============================================================
           คลิกซ้าย
           ใช้สำหรับกดปุ่ม Menu / About / Photo
        ============================================================ */

        renderer.domElement.addEventListener(

            'click',

            (event) => {


                /* ถ้ากำลังดูอยู่
                   คลิกซ้ายไม่ทำอะไร
                   ต้องคลิกขวาเพื่อออก
                */

                if (viewingMode) {

                    return;

                }


                if (!modelRoot)
                    return;


                /* Mouse Position */

                mouse.x =

                    (
                        event.clientX /
                        window.innerWidth
                    ) * 2 - 1;


                mouse.y =

                    -(
                        event.clientY /
                        window.innerHeight
                    ) * 2 + 1;


                /* Raycaster */

                raycaster.setFromCamera(

                    mouse,

                    camera

                );


                const intersects =

                    raycaster.intersectObject(

                        modelRoot,

                        true

                    );


                if (
                    intersects.length === 0
                ) {

                    return;

                }


                const hit =
                    intersects[0].object;


                /* Debug */

                const debugBox =
                    document.getElementById(
                        'debugBox'
                    );


                debugBox.style.display =
                    'block';


                debugBox.innerText =
                    'คลิกโดน: ' + hit.name;


                console.log(

                    'คลิกโดน object ชื่อ:',

                    hit.name

                );


                /* Menu */

                if (
                    hit === menuButtonObj
                ) {

                    showMenu();

                }


                /* About Me */

                else if (
                    hit === aboutButtonObj
                ) {

                    showAboutMe();

                }


                /* Photo */

                else if (
                    hit === photoButtonObj
                ) {

                    showPhoto();

                }

            }

        );


        /* ============================================================
           คลิกขวา
           ใช้สำหรับออกจากการดู
        ============================================================ */

        renderer.domElement.addEventListener(

            'contextmenu',

            (event) => {


                /* ปิดเมนูคลิกขวาของ Browser */

                event.preventDefault();


                /* ถ้าไม่ได้อยู่ในโหมดดู
                   ไม่ต้องทำอะไร
                */

                if (!viewingMode) {

                    return;

                }


                /* ออกจากโหมดดู */

                viewingMode = false;


                /* กล้องกลับตำแหน่งเดิม */

                resetCamera();


                /* เปลี่ยนข้อความ */

                document.getElementById(
                    'hint'
                ).innerText =

                    'คลิก Menu / About Me / Photo เพื่อดูโมเดล';

            }

        );


        /* ============================================================
           Camera Focus
        ============================================================ */

        let flyAnim = null;


        function focusOnObject(

            obj,

            distanceMultiplier = 2.2

        ) {


            if (!obj)
                return;


            const box =
                new THREE.Box3()
                    .setFromObject(
                        obj
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxDim =
                Math.max(

                    size.x,

                    size.y,

                    size.z,

                    0.2

                );


            const dir =
                new THREE.Vector3()
                    .subVectors(

                        camera.position,

                        controls.target

                    )
                    .normalize();


            const targetCamPos =
                center
                    .clone()
                    .add(

                        dir.multiplyScalar(

                            maxDim *
                            distanceMultiplier

                        )

                    );


            flyCameraTo(

                targetCamPos,

                center

            );

        }


        /* ============================================================
           Camera Fly
        ============================================================ */

        function flyCameraTo(

            targetPos,

            targetLook,

            duration = 900

        ) {


            if (flyAnim) {

                cancelAnimationFrame(
                    flyAnim.id
                );

            }


            const startPos =
                camera.position.clone();


            const startTarget =
                controls.target.clone();


            const startTime =
                performance.now();


            controls.enabled = false;


            function step(now) {


                const t =

                    Math.min(

                        (now - startTime) /
                        duration,

                        1

                    );


                const ease =

                    t < 0.5

                        ?

                        2 * t * t

                        :

                        1 -

                        Math.pow(

                            -2 * t + 2,

                            2

                        ) / 2;


                camera.position.lerpVectors(

                    startPos,

                    targetPos,

                    ease

                );


                controls.target.lerpVectors(

                    startTarget,

                    targetLook,

                    ease

                );


                controls.update();


                if (t < 1) {

                    flyAnim = {

                        id:
                            requestAnimationFrame(
                                step
                            )

                    };

                }

                else {

                    controls.enabled = true;

                }

            }


            flyAnim = {

                id:
                    requestAnimationFrame(
                        step
                    )

            };

        }


        /* ============================================================
           กลับกล้อง
        ============================================================ */

        function resetCamera() {


            flyCameraTo(

                defaultCamPos,

                defaultCamTarget

            );

        }


        /* ============================================================
           Menu
        ============================================================ */

        function showMenu() {


            viewingMode = true;


            document.getElementById(
                'hint'
            ).innerText =

                'กำลังดู Menu — คลิกขวาเพื่อออก';


            focusOnObject(

                menuTargetObj,

                1.6

            );

        }


        /* ============================================================
           About Me
        ============================================================ */

        function showAboutMe() {


            viewingMode = true;


            document.getElementById(
                'hint'
            ).innerText =

                'กำลังดู About Me — คลิกขวาเพื่อออก';


            focusOnObject(

                aboutTargetObj,

                2.0

            );

        }


        /* ============================================================
           Photo
        ============================================================ */

        function showPhoto() {


            viewingMode = true;


            document.getElementById(
                'hint'
            ).innerText =

                'กำลังดู Photo — คลิกขวาเพื่อออก';


            focusOnObject(

                photoTargetObj,

                1.4

            );

        }


        /* ============================================================
           Animation Loop
        ============================================================ */

        function animate() {


            controls.update();


            const t =
                clock.getElapsedTime();


            curtainShaders.forEach(

                (shader) => {

                    shader.uniforms.uTime.value =
                        t;

                }

            );


            renderer.render(

                scene,

                camera

            );


            requestAnimationFrame(
                animate
            );

        }


        animate();


        /* ============================================================
           Resize
        ============================================================ */

        window.addEventListener(

            'resize',

            () => {


                camera.aspect =

                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );

    </script>

</body>
</html>
