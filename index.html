<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model - Shushi</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1a1a1a;
}
canvas{
    display:block;
}
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1a1a1a);


// ===============================
// CAMERA
// ===============================

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,8);


// ===============================
// RENDERER
// ===============================

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


// ===============================
// LIGHT
// ===============================

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1.0
    );

scene.add(ambientLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.2
    );

directionalLight.position.set(
    0,
    10,
    10
);

scene.add(directionalLight);


// ===============================
// CONTROLS
// ===============================

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.08;

controls.mouseButtons.LEFT =
    THREE.MOUSE.ROTATE;

controls.mouseButtons.RIGHT =
    THREE.MOUSE.PAN;

controls.mouseButtons.MIDDLE = null;


// ===============================
// TOON GRADIENT
// ===============================

const gradientCanvas =
    document.createElement("canvas");

gradientCanvas.width = 4;
gradientCanvas.height = 1;

const gradientContext =
    gradientCanvas.getContext("2d");

const gradientData =
    [80,140,190,255];

for(let i=0;i<gradientData.length;i++){

    const value =
        gradientData[i];

    gradientContext.fillStyle =
        `rgb(${value},${value},${value})`;

    gradientContext.fillRect(
        i,
        0,
        1,
        1
    );
}

const toonGradientMap =
    new THREE.CanvasTexture(
        gradientCanvas
    );

toonGradientMap.minFilter =
    THREE.NearestFilter;

toonGradientMap.magFilter =
    THREE.NearestFilter;

toonGradientMap.generateMipmaps =
    false;


// ===============================
// VARIABLES
// ===============================

let model = null;

let button025 = null;
let button026 = null;
let button027 = null;

let target030 = null;
let target028 = null;

let flyAnimation = null;

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

const clock =
    new THREE.Clock();

const curtainShaders = [];


// ===============================
// GLTF LOADER
// ===============================

const loader =
    new THREE.GLTFLoader();

const dracoLoader =
    new THREE.DRACOLoader();

dracoLoader.setDecoderPath(
    "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

loader.setDRACOLoader(
    dracoLoader
);


// ===============================
// LOAD MODEL
// ===============================

loader.load(

    "https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=3",

    function(gltf){

        model = gltf.scene;

        scene.add(model);


        // ===============================
        // MODEL TRAVERSE
        // ===============================

        model.traverse(function(node){

            if(!node.isMesh) return;


            node.castShadow = true;

            node.receiveShadow = true;


            const originalMap =
                node.material &&
                node.material.map
                ?
                node.material.map
                :
                null;


            const originalColor =
                node.material &&
                node.material.color
                ?
                node.material.color.clone()
                :
                new THREE.Color(0xffffff);


            // ===============================
            // ICOSPHERE
            // ===============================

            if(
                node.name === "Icosphere" ||
                node.name === "Icosphere.001"
            ){

                node.material =
                    new THREE.MeshToonMaterial({

                        color:
                            originalColor,

                        gradientMap:
                            toonGradientMap,

                        side:
                            THREE.DoubleSide

                    });

            }


            // ===============================
            // CYLINDER
            // ===============================

            if(
                node.name.startsWith(
                    "Cylinder"
                )
            ){

                node.material =
                    new THREE.MeshStandardMaterial({

                        map:
                            originalMap,

                        color:
                            originalColor,

                        metalness:
                            0.85,

                        roughness:
                            0.25,

                        side:
                            THREE.DoubleSide

                    });

            }


            // ===============================
            // CURTAIN
            // ===============================

            if(
                node.name === "Plane.011" &&
                node.material
            ){

                node.material.onBeforeCompile =
                    function(shader){

                        shader.uniforms.uTime = {
                            value:0
                        };


                        shader.vertexShader =
                            "uniform float uTime;\n" +
                            shader.vertexShader;


                        shader.vertexShader =
                            shader.vertexShader.replace(

                                "#include <begin_vertex>",

                                `
                                #include <begin_vertex>

                                float wave1 =
                                    sin(
                                        position.y * 5.0
                                        +
                                        uTime * 2.0
                                    );

                                float wave2 =
                                    sin(
                                        position.x * 8.0
                                        +
                                        uTime * 2.5
                                    );

                                float wave =
                                    wave1 * 0.08
                                    +
                                    wave2 * 0.04;

                                float hangFactor =
                                    clamp(
                                        1.0 -
                                        (position.y + 0.5),
                                        0.0,
                                        1.0
                                    );

                                transformed.x +=
                                    wave *
                                    hangFactor;

                                transformed.z +=
                                    wave *
                                    0.5 *
                                    hangFactor;
                                `
                            );


                        curtainShaders.push(
                            shader
                        );

                    };


                node.material.needsUpdate =
                    true;

            }


            // ==================================================
            // BUTTONS
            // ==================================================

            // Plane025 -> Plane030

            if(
                node.name === "Plane025"
            ){

                button025 = node;

            }


            // Plane026 -> Plane028

            if(
                node.name === "Plane026"
            ){

                button026 = node;

            }


            // Plane027 -> portfolio

            if(
                node.name === "Plane027"
            ){

                button027 = node;

            }


            // ==================================================
            // TARGETS
            // ==================================================

            if(
                node.name === "Plane030"
            ){

                target030 = node;

            }


            if(
                node.name === "Plane028"
            ){

                target028 = node;

            }

        });


        // ===============================
        // MODEL ROTATION
        // ===============================

        model.rotation.y =
            -Math.PI / 2;


        // ===============================
        // CENTER MODEL
        // ===============================

        const box =
            new THREE.Box3()
                .setFromObject(model);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );

        const size =
            box.getSize(
                new THREE.Vector3()
            );


        model.position.sub(
            center
        );


        // ===============================
        // CAMERA
        // ===============================

        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const distance =
            maxDimension /
            Math.tan(
                THREE.MathUtils.degToRad(
                    camera.fov / 2
                )
            );


        camera.position.set(
            0,
            maxDimension * 0.2,
            distance * 0.8
        );


        camera.lookAt(
            0,
            0,
            0
        );


        controls.target.set(
            0,
            0,
            0
        );


        controls.update();


        // ===============================
        // DEBUG
        // ===============================

        console.log(
            "Plane025 =",
            button025
        );

        console.log(
            "Plane026 =",
            button026
        );

        console.log(
            "Plane027 =",
            button027
        );

        console.log(
            "Plane030 =",
            target030
        );

        console.log(
            "Plane028 =",
            target028
        );


        console.log(
            "MODEL LOADED"
        );

    },


    function(xhr){

        if(xhr.total){

            console.log(
                "Loading:",
                (
                    xhr.loaded /
                    xhr.total *
                    100
                ).toFixed(0) + "%"
            );

        }

    },


    function(error){

        console.error(
            "GLB ERROR:",
            error
        );

    }

);


// ===============================
// OBJECT CHECK
// ===============================

function isObjectOrChild(
    object,
    target
){

    let current =
        object;


    while(current){

        if(current === target){

            return true;

        }

        current =
            current.parent;

    }


    return false;

}


// ===============================
// CAMERA FOCUS
// ===============================

function focusOnObject(
    target
){

    if(!target) return null;


    const box =
        new THREE.Box3()
            .setFromObject(
                target
            );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance =
        maxDimension * 4;


    return {

        position:
            new THREE.Vector3(
                center.x,
                center.y,
                center.z +
                distance
            ),

        target:
            center.clone()

    };

}


// ===============================
// FLY CAMERA
// ===============================

function flyCameraTo(
    target
){

    if(!target) return;


    const result =
        focusOnObject(
            target
        );


    if(!result) return;


    flyAnimation = {

        startTime:
            performance.now(),

        duration:
            900,

        startPosition:
            camera.position.clone(),

        endPosition:
            result.position.clone(),

        startTarget:
            controls.target.clone(),

        endTarget:
            result.target.clone()

    };

}


// ===============================
// CLICK
// ===============================

renderer.domElement.addEventListener(
    "click",
    function(event){

        if(!model) return;


        // ไม่ล็อกการกดระหว่างกล้องเคลื่อน
        // เพื่อให้ปุ่มยังตรวจสอบได้


        const rect =
            renderer.domElement
                .getBoundingClientRect();


        mouse.x =
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
            * 2 - 1;


        mouse.y =
            -(
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            )
            * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const intersects =
            raycaster.intersectObject(
                model,
                true
            );


        if(
            intersects.length === 0
        ){

            return;

        }


        // ===============================
        // ตรวจทุกจุดที่โดนคลิก
        // ===============================

        for(
            let i = 0;
            i < intersects.length;
            i++
        ){

            const hit =
                intersects[i];


            console.log(
                "CLICK OBJECT:",
                hit.object.name
            );


            // ===============================
            // Plane025 -> Plane030
            // ===============================

            if(
                button025 &&
                isObjectOrChild(
                    hit.object,
                    button025
                )
            ){

                console.log(
                    "Plane025 -> Plane030"
                );


                flyCameraTo(
                    target030
                );


                return;

            }


            // ===============================
            // Plane026 -> Plane028
            // ===============================

            if(
                button026 &&
                isObjectOrChild(
                    hit.object,
                    button026
                )
            ){

                console.log(
                    "Plane026 -> Plane028"
                );


                flyCameraTo(
                    target028
                );


                return;

            }


            // ===============================
            // Plane027 -> PORTFOLIO
            // ===============================

            if(
                button027 &&
                isObjectOrChild(
                    hit.object,
                    button027
                )
            ){

                console.log(
                    "Plane027 -> portfolio"
                );


                window.location.href =
                    "portfolio.html";


                return;

            }

        }

    }
);


// ===============================
// ANIMATION
// ===============================

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    // ===============================
    // CURTAIN
    // ===============================

    curtainShaders.forEach(
        function(shader){

            shader.uniforms.uTime.value =
                time;

        }
    );


    // ===============================
    // CAMERA FLY
    // ===============================

    if(flyAnimation){

        const elapsed =
            performance.now()
            -
            flyAnimation.startTime;


        let progress =
            elapsed /
            flyAnimation.duration;


        if(progress >= 1){

            progress = 1;

        }


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        camera.position.lerpVectors(

            flyAnimation.startPosition,

            flyAnimation.endPosition,

            eased

        );


        controls.target.lerpVectors(

            flyAnimation.startTarget,

            flyAnimation.endTarget,

            eased

        );


        if(progress >= 1){

            flyAnimation = null;

        }

    }


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


// ===============================
// RESIZE
// ===============================

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
