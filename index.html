<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model - Shushi</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Sarabun', 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* --- เมนูตัวเลือกเมื่อคลิกป้ายหน้าร้าน --- */
        #pickMenu {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 18px 22px;
            color: #fff;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-width: 260px;
        }
        #pickMenu h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.85;
        }
        #pickMenu button {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #2b2b2b;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #pickMenu button:hover { background: #e63946; }
        #pickMenu .closeBtn {
            background: transparent;
            text-align: center;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* --- แผงข้อมูล (portfolio / about us) --- */
        #infoPanel {
            display: none;
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            width: 300px;
            max-width: 80vw;
            background: rgba(20,20,20,0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 20px;
            color: #fff;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #infoPanel h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ff5a5f;
        }
        #infoPanel p {
            margin: 4px 0;
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }
        #infoPanel .label {
            opacity: 0.55;
            font-size: 12px;
        }
        #infoPanel button {
            margin-top: 14px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        #infoPanel button:hover { background: #555; }

        #hint {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.55);
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hint">คลิกที่ป้ายหน้าร้านเพื่อดูเมนู</div>

    <!-- เมนู 3 ทางเลือก เมื่อคลิกป้ายหน้าร้าน (Plane.017) -->
    <div id="pickMenu">
        <h3>เลือกดูข้อมูล</h3>
        <button id="btnMenu">1. เมนูร้าน</button>
        <button id="btnPortfolio">2. ข้อมูล Portfolio</button>
        <button id="btnAbout">3. About Us</button>
        <button class="closeBtn" id="btnMenuClose">ปิด</button>
    </div>

    <!-- แผงข้อมูล portfolio / about us -->
    <div id="infoPanel">
        <div id="infoPanelContent"></div>
        <button id="btnInfoClose">← กลับ</button>
    </div>

    <!-- Core Three.js & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        /* ============================================================
           ตั้งค่า / ข้อมูล
           ============================================================ */

        const CURTAIN_OBJECT_NAMES = [ "Plane.011" ];

        // ข้อมูล portfolio ของเจ้าของ
        const portfolioData = {
            name: "ศุภวิชญ์ พุ่มพฤกษ์",
            studentId: "6721601508",
            major: "วิทยาการคอมพิวเตอร์",
            faculty: "ศิลปศาสตร์และวิทยาศาสตร์",
            bio: "เนื้อหา portfolio (ผลงาน / โปรเจกต์) จะเพิ่มเติมภายหลัง"
        };

        /* ============================================================
           1. Setup Scene & Camera
           ============================================================ */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // แก้สีเพี้ยน
        renderer.outputEncoding = THREE.sRGBEncoding;

        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // แสงสว่าง
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(0, 10, 10);
        scene.add(directionalLight);

        /* ============================================================
           Cel-shading gradient map (สำหรับ Icosphere)
           ============================================================ */
        function createToonGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const shades = [80, 140, 190, 255];
            shades.forEach((v, i) => {
                ctx.fillStyle = `rgb(${v},${v},${v})`;
                ctx.fillRect(i, 0, 1, 1);
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
            return texture;
        }
        const toonGradientMap = createToonGradientTexture();

        /* ============================================================
           ตัวแปรเก็บ object สำคัญ + สถานะกล้อง
           ============================================================ */
        let modelRoot = null;
        let signObject = null;      // Plane.017 - ป้ายหน้าร้าน
        let menuObject = null;      // Plane.016 - เมนูร้าน
        let portfolioObject = null; // Plane.012 - ทีวี portfolio
        let aboutObject = null;     // Plane.021 - about us

        let defaultCamPos = new THREE.Vector3();
        let defaultCamTarget = new THREE.Vector3();

        // vertex-shader ที่ผูกกับ material ของผ้าม่าน (ไว้อัปเดต uTime ทุกเฟรม)
        const curtainShaders = [];
        const clock = new THREE.Clock();

        /* ============================================================
           2. โหลดโมเดล Shushi.glb
           ============================================================ */
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        loader.load('https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=', (gltf) => {
            const model = gltf.scene;
            modelRoot = model;

            // --- [หมุนโมเดลให้หน้าร้านหันเข้าหากล้อง] ---
            model.rotation.y = -Math.PI / 2;

            // --- ไล่ดูทุก mesh ในโมเดล เพื่อสลับวัสดุ / เก็บ reference / ผูก shader ---
            model.traverse((node) => {
                if (!node.isMesh) return;

                const originalMap = node.material ? node.material.map : null;
                const originalColor = node.material && node.material.color
                    ? node.material.color.clone()
                    : new THREE.Color(0xffffff);

                // --- PBR material สำหรับ Cylinder ---
                if (node.name.startsWith('Cylinder')) {
                    node.material = new THREE.MeshStandardMaterial({
                        map: originalMap,
                        color: originalColor,
                        metalness: 0.85,
                        roughness: 0.25,
                    });
                }

                // --- Cel Shading material สำหรับ Icosphere ---
                if (node.name.startsWith('Icosphere')) {
                    node.material = new THREE.MeshToonMaterial({
                        map: originalMap,
                        color: originalColor,
                        gradientMap: toonGradientMap,
                    });
                }

                // --- เก็บ reference object สำหรับ picking menu ---
                if (node.name === 'Plane.017') signObject = node;
                if (node.name === 'Plane.016') menuObject = node;
                if (node.name === 'Plane.012') portfolioObject = node;
                if (node.name === 'Plane.021') aboutObject = node;

                // --- Vertex Shader: คลื่นไหวบนผ้าม่านสีแดง ---
                if (CURTAIN_OBJECT_NAMES.includes(node.name)) {
                    node.material.onBeforeCompile = (shader) => {
                        shader.uniforms.uTime = { value: 0 };
                        shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader;
                        shader.vertexShader = shader.vertexShader.replace(
                            '#include <begin_vertex>',
                            `
                            #include <begin_vertex>
                            float waveStrength = 0.04;
                            float waveSpeed = 2.0;
                            float waveFreq = 6.0;
                            // ยิ่งอยู่ด้านล่าง (y ต่ำ) ยิ่งไหวมาก, ด้านบน (ติดคาน) แทบไม่ขยับ
                            float hangFactor = clamp(1.0 - (position.y + 1.0), 0.0, 1.0);
                            transformed.x += sin(position.y * waveFreq + uTime * waveSpeed) * waveStrength * hangFactor;
                            transformed.z += cos(position.y * waveFreq * 0.7 + uTime * waveSpeed) * waveStrength * 0.5 * hangFactor;
                            `
                        );
                        curtainShaders.push(shader);
                    };
                    node.material.needsUpdate = true;
                }
            });

            // คำนวณขนาดและจุดศูนย์กลางหลังจากหมุน
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // จัดกึ่งกลางโมเดล
            model.position.sub(center);

            // คำนวณระยะถอยกล้องให้พอดีหน้าจอ
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
            cameraZ *= 1.35;

            camera.position.set(0, 0, cameraZ);
            controls.target.set(0, 0, 0);
            controls.update();

            defaultCamPos.copy(camera.position);
            defaultCamTarget.copy(controls.target);

            scene.add(model);
        }, undefined, (error) => {
            console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
        });

        /* ============================================================
           3. Picking (Raycaster) - คลิกวัตถุในฉาก
           ============================================================ */
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            if (!modelRoot) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(modelRoot, true);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hit === signObject) {
                    openPickMenu();
                }
            }
        });

        /* ============================================================
           4. กล้องเลื่อนไปโฟกัสวัตถุ (camera fly / tween)
           ============================================================ */
        let flyAnim = null;

        function focusOnObject(obj, distanceMultiplier = 2.2) {
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, 0.2);

            // ทิศทางเดิมของกล้อง (มองจากตำแหน่งปัจจุบันเข้าหาวัตถุ)
            const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
            const targetCamPos = center.clone().add(dir.multiplyScalar(maxDim * distanceMultiplier));

            flyCameraTo(targetCamPos, center);
        }

        function flyCameraTo(targetPos, targetLook, duration = 900) {
            if (flyAnim) cancelAnimationFrame(flyAnim.id);

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();

            controls.enabled = false;

            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad

                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLook, ease);
                controls.update();

                if (t < 1) {
                    flyAnim = { id: requestAnimationFrame(step) };
                } else {
                    controls.enabled = true;
                }
            }
            flyAnim = { id: requestAnimationFrame(step) };
        }

        function resetCamera() {
            flyCameraTo(defaultCamPos, defaultCamTarget);
        }

        /* ============================================================
           5. เมนู & แผงข้อมูล (UI)
           ============================================================ */
        const pickMenuEl = document.getElementById('pickMenu');
        const infoPanelEl = document.getElementById('infoPanel');
        const infoPanelContentEl = document.getElementById('infoPanelContent');
        const hintEl = document.getElementById('hint');

        function openPickMenu() {
            pickMenuEl.style.display = 'block';
            hintEl.style.display = 'none';
        }
        function closePickMenu() {
            pickMenuEl.style.display = 'none';
        }
        function openInfoPanel(html) {
            infoPanelContentEl.innerHTML = html;
            infoPanelEl.style.display = 'block';
        }
        function closeInfoPanel() {
            infoPanelEl.style.display = 'none';
            resetCamera();
            hintEl.style.display = 'block';
        }

        document.getElementById('btnMenuClose').onclick = closePickMenu;
        document.getElementById('btnInfoClose').onclick = closeInfoPanel;

        // 1. เมนูร้าน
        document.getElementById('btnMenu').onclick = () => {
            closePickMenu();
            if (menuObject) focusOnObject(menuObject, 1.6);
            openInfoPanel(`
                <h2>เมนูร้าน SHUSHIDAI</h2>
                <p>-Sake shushi</p>
                <p>-Toro shushi</p>
                <p>-Ika shushi</p>
                <p>-Hirame shushi</p>
                <p>-Hotate shushi</p>
                <p>-Maguro shushi</p>
            `);
        };

        // 2. ข้อมูล Portfolio
        document.getElementById('btnPortfolio').onclick = () => {
            closePickMenu();
            if (portfolioObject) focusOnObject(portfolioObject, 2.0);
            openInfoPanel(`
                <h2>Portfolio</h2>
                <p><span class="label">ชื่อ-สกุล</span><br>${portfolioData.name}</p>
                <p><span class="label">รหัสนักศึกษา</span><br>${portfolioData.studentId}</p>
                <p><span class="label">สาขา</span><br>${portfolioData.major}</p>
                <p><span class="label">คณะ</span><br>${portfolioData.faculty}</p>
                <p style="margin-top:10px; opacity:0.7; font-style:italic;">${portfolioData.bio}</p>
            `);
        };

        // 3. About Us
        document.getElementById('btnAbout').onclick = () => {
            closePickMenu();
            if (aboutObject) focusOnObject(aboutObject, 2.0);
            openInfoPanel(`
                <h2>About Us</h2>
                <p>SHUSHIDAI คือร้านซูชิขนาดเล็ก จำลองขึ้นเป็นแบบจำลอง 3 มิติเพื่อการศึกษา
                ในรายวิชา Interactive 3D Portfolio</p>
                <p style="margin-top:8px; opacity:0.7; font-style:italic;">
                (เนื้อหาเพิ่มเติมสามารถแก้ไขได้ในภายหลัง)
                </p>
            `);
        };

        /* ============================================================
           6. Loop Render
           ============================================================ */
        function animate() {
            controls.update();

            const t = clock.getElapsedTime();
            curtainShaders.forEach((shader) => {
                shader.uniforms.uTime.value = t;
            });

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // ปรับขนาดอัตโนมัติเมื่อย่อ/ขยายหน้าจอ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
