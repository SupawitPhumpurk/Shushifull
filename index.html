<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model - Shushi</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

    </style>
</head>

<body>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- GLTF Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Draco Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>


    <script>

        /* ============================================================
           ตั้งค่าผ้าม่าน
        ============================================================ */

        const CURTAIN_OBJECT_NAMES = [
            "Plane011"
        ];


        /* ============================================================
           Scene
        ============================================================ */

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0x1a1a1a);


        /* ============================================================
           Camera
        ============================================================ */

        const camera =
            new THREE.PerspectiveCamera(

                45,

                window.innerWidth /
                window.innerHeight,

                0.01,

                1000

            );


        /* ============================================================
           Renderer
        ============================================================ */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            window.devicePixelRatio

        );


        renderer.outputEncoding =
            THREE.sRGBEncoding;


        document.body.appendChild(
            renderer.domElement
        );


        /* ============================================================
           Orbit Controls
        ============================================================ */

        const controls =
            new THREE.OrbitControls(

                camera,

                renderer.domElement

            );


        controls.enableDamping = true;


        /* ============================================================
           แสง
        ============================================================ */

        const ambientLight =
            new THREE.AmbientLight(

                0xffffff,

                1.0

            );


        scene.add(
            ambientLight
        );


        const directionalLight =
            new THREE.DirectionalLight(

                0xffffff,

                1.2

            );


        directionalLight.position.set(

            0,

            10,

            10

        );


        scene.add(
            directionalLight
        );


        /* ============================================================
           Toon Gradient
        ============================================================ */

        function createToonGradientTexture() {

            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width = 4;

            canvas.height = 1;


            const ctx =
                canvas.getContext('2d');


            const shades = [

                80,
                140,
                190,
                255

            ];


            shades.forEach(

                (value, index) => {

                    ctx.fillStyle =
                        `rgb(${value},${value},${value})`;

                    ctx.fillRect(

                        index,
                        0,
                        1,
                        1

                    );

                }

            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            texture.minFilter =
                THREE.NearestFilter;


            texture.magFilter =
                THREE.NearestFilter;


            texture.generateMipmaps =
                false;


            return texture;

        }


        const toonGradientMap =
            createToonGradientTexture();


        /* ============================================================
           ตัวแปรโมเดล
        ============================================================ */

        let modelRoot = null;


        /* ============================================================
           ปุ่ม 3 จุด
        ============================================================ */

        let menuButtonObj = null;

        let aboutButtonObj = null;

        let photoButtonObj = null;


        /* ============================================================
           จุด Target สำหรับกล้อง
        ============================================================ */

        let menuTargetObj = null;

        let aboutTargetObj = null;

        let photoTargetObj = null;


        /* ============================================================
           ตำแหน่งกล้องเริ่มต้น
        ============================================================ */

        let defaultCamPos =
            new THREE.Vector3();


        let defaultCamTarget =
            new THREE.Vector3();


        /* ============================================================
           สถานะการดูจุด
        ============================================================ */

        let viewingMode = false;


        /* ============================================================
           Animation ผ้าม่าน
        ============================================================ */

        const curtainShaders = [];


        const clock =
            new THREE.Clock();


        /* ============================================================
           GLTF Loader
        ============================================================ */

        const loader =
            new THREE.GLTFLoader();


        /* ============================================================
           Draco Loader
        ============================================================ */

        const dracoLoader =
            new THREE.DRACOLoader();


        dracoLoader.setDecoderPath(

            'https://www.gstatic.com/draco/versioned/decoders/1.5.6/'

        );


        loader.setDRACOLoader(
            dracoLoader
        );


        /* ============================================================
           โหลดโมเดล
        ============================================================ */

        loader.load(

            'https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=',


            function (gltf) {

                const model =
                    gltf.scene;


                modelRoot =
                    model;


                /* ====================================================
                   หมุนโมเดล
                ==================================================== */

                model.rotation.y =
                    -Math.PI / 2;


                /* ====================================================
                   ตรวจทุก Object
                ==================================================== */

                model.traverse(

                    function (node) {

                        if (!node.isMesh) {
                            return;
                        }


                        /* =================================================
                           Material เดิม
                        ================================================= */

                        const originalMap =
                            node.material
                                ? node.material.map
                                : null;


                        const originalColor =
                            node.material &&
                            node.material.color

                                ? node.material.color.clone()

                                : new THREE.Color(
                                    0xffffff
                                );


                        /* =================================================
                           Cylinder
                        ================================================= */

                        if (

                            node.name.startsWith(
                                'Cylinder'
                            )

                        ) {

                            node.material =
                                new THREE.MeshStandardMaterial({

                                    map:
                                        originalMap,

                                    color:
                                        originalColor,

                                    metalness:
                                        0.85,

                                    roughness:
                                        0.25

                                });

                        }


                        /* =================================================
                           Icosphere
                        ================================================= */

                        if (

                            node.name.startsWith(
                                'Icosphere'
                            )

                        ) {

                            node.material =
                                new THREE.MeshToonMaterial({

                                    map:
                                        originalMap,

                                    color:
                                        originalColor,

                                    gradientMap:
                                        toonGradientMap

                                });

                        }


                        /* =================================================
                           ปุ่ม Menu
                        ================================================= */

                        if (

                            node.name ===
                            'Plane025'

                        ) {

                            menuButtonObj =
                                node;

                        }


                        /* =================================================
                           ปุ่ม About Me
                        ================================================= */

                        if (

                            node.name ===
                            'Plane026'

                        ) {

                            aboutButtonObj =
                                node;

                        }


                        /* =================================================
                           ปุ่ม Photo
                        ================================================= */

                        if (

                            node.name ===
                            'Plane027'

                        ) {

                            photoButtonObj =
                                node;

                        }


                        /* =================================================
                           Target Menu
                        ================================================= */

                        if (

                            node.name ===
                            'Plane016'

                        ) {

                            menuTargetObj =
                                node;

                        }


                        /* =================================================
                           Target About Me
                        ================================================= */

                        if (

                            node.name ===
                            'Plane017'

                        ) {

                            aboutTargetObj =
                                node;

                        }


                        /* =================================================
                           Target Photo
                        ================================================= */

                        if (

                            node.name ===
                            'Plane024'

                        ) {

                            photoTargetObj =
                                node;

                        }


                        /* =================================================
                           ผ้าม่าน
                        ================================================= */

                        if (

                            CURTAIN_OBJECT_NAMES.includes(
                                node.name
                            )

                        ) {

                            node.material.onBeforeCompile =
                                function (shader) {

                                    shader.uniforms.uTime = {
                                        value: 0
                                    };


                                    shader.vertexShader =
                                        'uniform float uTime;\n' +
                                        shader.vertexShader;


                                    shader.vertexShader =
                                        shader.vertexShader.replace(

                                            '#include <begin_vertex>',

                                            `

                                            #include <begin_vertex>

                                            float waveStrength = 0.04;

                                            float waveSpeed = 2.0;

                                            float waveFreq = 6.0;

                                            float hangFactor =
                                                clamp(
                                                    1.0 -
                                                    (position.y + 1.0),
                                                    0.0,
                                                    1.0
                                                );


                                            transformed.x +=

                                                sin(

                                                    position.y *
                                                    waveFreq +

                                                    uTime *
                                                    waveSpeed

                                                )

                                                *

                                                waveStrength

                                                *

                                                hangFactor;


                                            transformed.z +=

                                                cos(

                                                    position.y *
                                                    waveFreq *
                                                    0.7 +

                                                    uTime *
                                                    waveSpeed

                                                )

                                                *

                                                waveStrength *

                                                0.5 *

                                                hangFactor;

                                            `

                                        );


                                    curtainShaders.push(
                                        shader
                                    );

                                };


                            node.material.needsUpdate =
                                true;

                        }

                    }

                );


                /* ====================================================
                   หาขนาดโมเดล
                ==================================================== */

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            model
                        );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                /* ====================================================
                   จัดโมเดลให้อยู่ตรงกลาง
                ==================================================== */

                model.position.sub(
                    center
                );


                /* ====================================================
                   คำนวณตำแหน่งกล้อง
                ==================================================== */

                const maxDim =
                    Math.max(

                        size.x,
                        size.y,
                        size.z

                    );


                const fov =
                    camera.fov *
                    Math.PI /
                    180;


                let cameraZ =
                    Math.abs(

                        maxDim /

                        (
                            2 *
                            Math.tan(
                                fov / 2
                            )
                        )

                    );


                cameraZ *= 1.35;


                /* ====================================================
                   ตั้งกล้องเริ่มต้น
                ==================================================== */

                camera.position.set(

                    0,
                    0,
                    cameraZ

                );


                controls.target.set(

                    0,
                    0,
                    0

                );


                controls.update();


                /* ====================================================
                   บันทึกตำแหน่งกล้องเดิม
                ==================================================== */

                defaultCamPos.copy(
                    camera.position
                );


                defaultCamTarget.copy(
                    controls.target
                );


                /* ====================================================
                   เพิ่มโมเดลเข้า Scene
                ==================================================== */

                scene.add(
                    model
                );

            },


            undefined,


            function (error) {

                console.error(
                    error
                );

            }

        );


        /* ============================================================
           Raycaster
        ============================================================ */

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();


        /* ============================================================
           คลิกซ้าย
           ใช้เลือก Menu / About Me / Photo
        ============================================================ */

        renderer.domElement.addEventListener(

            'click',

            function (event) {

                /* ถ้ากำลังดูอยู่
                   คลิกซ้ายไม่ทำอะไร
                */

                if (viewingMode) {
                    return;
                }


                if (!modelRoot) {
                    return;
                }


                /* ====================================================
                   ตำแหน่ง Mouse
                ==================================================== */

                mouse.x =

                    (
                        event.clientX /
                        window.innerWidth
                    ) * 2 - 1;


                mouse.y =

                    -(
                        event.clientY /
                        window.innerHeight
                    ) * 2 + 1;


                /* ====================================================
                   Raycaster
                ==================================================== */

                raycaster.setFromCamera(

                    mouse,

                    camera

                );


                const intersects =
                    raycaster.intersectObject(

                        modelRoot,

                        true

                    );


                if (
                    intersects.length === 0
                ) {

                    return;

                }


                const hit =
                    intersects[0].object;


                /* ====================================================
                   Menu
                ==================================================== */

                if (
                    hit === menuButtonObj
                ) {

                    showMenu();

                }


                /* ====================================================
                   About Me
                ==================================================== */

                else if (
                    hit === aboutButtonObj
                ) {

                    showAboutMe();

                }


                /* ====================================================
                   Photo
                ==================================================== */

                else if (
                    hit === photoButtonObj
                ) {

                    showPhoto();

                }

            }

        );


        /* ============================================================
           คลิกขวา
           ใช้สำหรับออกจากการดู
        ============================================================ */

        renderer.domElement.addEventListener(

            'contextmenu',

            function (event) {

                /* ป้องกันเมนู Browser */

                event.preventDefault();


                /* ถ้าไม่ได้อยู่ในโหมดดู */

                if (!viewingMode) {
                    return;
                }


                /* ออกจากโหมดดู */

                viewingMode = false;


                /* กลับกล้อง */

                resetCamera();

            }

        );


        /* ============================================================
           Camera Focus
        ============================================================ */

        function focusOnObject(

            object,

            distanceMultiplier = 2.2

        ) {

            if (!object) {
                return;
            }


            /* ========================================================
               หาขนาด Object
            ======================================================== */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        object
                    );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxDim =
                Math.max(

                    size.x,
                    size.y,
                    size.z,
                    0.2

                );


            /* ========================================================
               ทิศทางกล้อง
            ======================================================== */

            const direction =
                new THREE.Vector3()
                    .subVectors(

                        camera.position,

                        controls.target

                    )
                    .normalize();


            /* ========================================================
               ตำแหน่งกล้องใหม่
            ======================================================== */

            const targetCameraPosition =
                center.clone().add(

                    direction.multiplyScalar(

                        maxDim *
                        distanceMultiplier

                    )

                );


            /* ========================================================
               บินกล้อง
            ======================================================== */

            flyCameraTo(

                targetCameraPosition,

                center

            );

        }


        /* ============================================================
           Camera Animation
        ============================================================ */

        let flyAnimation = null;


        function flyCameraTo(

            targetPosition,

            targetLookAt,

            duration = 900

        ) {

            /* ยกเลิก Animation เดิม */

            if (flyAnimation) {

                cancelAnimationFrame(
                    flyAnimation
                );

            }


            const startPosition =
                camera.position.clone();


            const startTarget =
                controls.target.clone();


            const startTime =
                performance.now();


            /* ปิดการควบคุมชั่วคราว */

            controls.enabled = false;


            function animateCamera(now) {

                const elapsed =
                    now - startTime;


                const progress =
                    Math.min(

                        elapsed /
                        duration,

                        1

                    );


                /* ====================================================
                   Ease In Out
                ==================================================== */

                const ease =

                    progress < 0.5

                        ?

                        2 *
                        progress *
                        progress

                        :

                        1 -

                        Math.pow(

                            -2 *
                            progress +
                            2,

                            2

                        ) / 2;


                /* ====================================================
                   Camera Position
                ==================================================== */

                camera.position.lerpVectors(

                    startPosition,

                    targetPosition,

                    ease

                );


                /* ====================================================
                   Camera Target
                ==================================================== */

                controls.target.lerpVectors(

                    startTarget,

                    targetLookAt,

                    ease

                );


                controls.update();


                /* ====================================================
                   ทำต่อ
                ==================================================== */

                if (progress < 1) {

                    flyAnimation =
                        requestAnimationFrame(
                            animateCamera
                        );

                }

                else {

                    controls.enabled = true;

                    flyAnimation = null;

                }

            }


            flyAnimation =
                requestAnimationFrame(
                    animateCamera
                );

        }


        /* ============================================================
           กลับกล้องตำแหน่งเดิม
        ============================================================ */

        function resetCamera() {

            flyCameraTo(

                defaultCamPos,

                defaultCamTarget

            );

        }


        /* ============================================================
           Menu
        ============================================================ */

        function showMenu() {

            viewingMode = true;


            focusOnObject(

                menuTargetObj,

                1.6

            );

        }


        /* ============================================================
           About Me
        ============================================================ */

        function showAboutMe() {

            viewingMode = true;


            focusOnObject(

                aboutTargetObj,

                2.0

            );

        }


        /* ============================================================
           Photo
        ============================================================ */

        function showPhoto() {

            viewingMode = true;


            focusOnObject(

                photoTargetObj,

                1.4

            );

        }


        /* ============================================================
           Animation Loop
        ============================================================ */

        function animate() {

            requestAnimationFrame(
                animate
            );


            /* Orbit Controls */

            controls.update();


            /* ========================================================
               ผ้าม่าน
            ======================================================== */

            const time =
                clock.getElapsedTime();


            curtainShaders.forEach(

                function (shader) {

                    shader.uniforms.uTime.value =
                        time;

                }

            );


            /* ========================================================
               Render
            ======================================================== */

            renderer.render(

                scene,

                camera

            );

        }


        animate();


        /* ============================================================
           Resize
        ============================================================ */

        window.addEventListener(

            'resize',

            function () {

                camera.aspect =

                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );

    </script>

</body>
</html>
