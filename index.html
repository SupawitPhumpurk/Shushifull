<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Model - Shushi</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #1a1a1a;

        }

        canvas {

            display: block;

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


<!-- =========================================================
     THREE.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>


<script>


/* ============================================================
   SETTINGS
============================================================ */

const CURTAIN_OBJECT_NAMES = [

    "Plane011"

];


/* ============================================================
   SCENE
============================================================ */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x1a1a1a
    );


/* ============================================================
   CAMERA
============================================================ */

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


/* ============================================================
   RENDERER
============================================================ */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    window.devicePixelRatio

);


renderer.outputEncoding =
    THREE.sRGBEncoding;


document.body.appendChild(

    renderer.domElement

);


/* ============================================================
   ORBIT CONTROLS

   คลิกซ้าย + ลาก = หมุน
   Scroll = Zoom
============================================================ */

const controls =
    new THREE.OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;


controls.enableRotate =
    true;


controls.enableZoom =
    true;


controls.enablePan =
    false;


/* คลิกซ้ายหมุน */

controls.mouseButtons.LEFT =
    THREE.MOUSE.ROTATE;


/* ปิดคลิกขวา */

controls.mouseButtons.RIGHT =
    null;


/* ============================================================
   LIGHT
============================================================ */

const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        1.0

    );


scene.add(

    ambientLight

);


const directionalLight =
    new THREE.DirectionalLight(

        0xffffff,

        1.2

    );


directionalLight.position.set(

    0,
    10,
    10

);


scene.add(

    directionalLight

);


/* ============================================================
   TOON GRADIENT
============================================================ */

function createToonGradientTexture() {


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 4;

    canvas.height = 1;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const shades = [

        80,
        140,
        190,
        255

    ];


    shades.forEach(

        (value, index) => {


            ctx.fillStyle =
                `rgb(${value},${value},${value})`;


            ctx.fillRect(

                index,
                0,
                1,
                1

            );

        }

    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.minFilter =
        THREE.NearestFilter;


    texture.magFilter =
        THREE.NearestFilter;


    texture.generateMipmaps =
        false;


    return texture;

}


const toonGradientMap =
    createToonGradientTexture();


/* ============================================================
   OBJECT VARIABLES
============================================================ */

let modelRoot = null;


/* ============================================================
   ปุ่มหลัก
============================================================ */

let menuButtonObj = null;

let aboutButtonObj = null;

let photoButtonObj = null;


/* ============================================================
   จุดปลายทาง
============================================================ */

/* MENU → Plane029 */

let menuTargetObj = null;


/* ABOUT ME → Plane028 */

let aboutTargetObj = null;


/* PHOTO → Plane024 */

let photoTargetObj = null;


/* ============================================================
   DEFAULT CAMERA
============================================================ */

let defaultCamPos =
    new THREE.Vector3();


let defaultCamTarget =
    new THREE.Vector3();


/* ============================================================
   VIEW MODE
============================================================ */

let viewingMode = false;


/* ============================================================
   CURRENT PAGE
============================================================ */

let currentPage = null;


/* ============================================================
   CAMERA ANIMATION
============================================================ */

let flyAnimation = null;


/* ============================================================
   CURTAIN
============================================================ */

const curtainShaders = [];


const clock =
    new THREE.Clock();


/* ============================================================
   GLTF LOADER
============================================================ */

const loader =
    new THREE.GLTFLoader();


/* ============================================================
   DRACO
============================================================ */

const dracoLoader =
    new THREE.DRACOLoader();


dracoLoader.setDecoderPath(

    "https://www.gstatic.com/draco/versioned/decoders/1.5.6/"

);


loader.setDRACOLoader(

    dracoLoader

);


/* ============================================================
   LOAD MODEL
============================================================ */

loader.load(

    "https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=1",


    function (gltf) {


        const model =
            gltf.scene;


        modelRoot =
            model;


        /* ====================================================
           MODEL ROTATION
        ==================================================== */

        model.rotation.y =
            -Math.PI / 2;


        /* ====================================================
           TRAVERSE MODEL
        ==================================================== */

        model.traverse(

            function (node) {


                if (!node.isMesh) {

                    return;

                }


                /* =================================================
                   ORIGINAL MATERIAL
                ================================================= */

                const originalMap =

                    node.material

                        ? node.material.map

                        : null;


                const originalColor =

                    node.material &&
                    node.material.color

                        ? node.material.color.clone()

                        : new THREE.Color(
                            0xffffff
                        );


                /* =================================================
                   PLANE BUTTONS = BLACK
                   
                   Plane025 = MENU
                   Plane026 = ABOUT ME
                   Plane027 = PHOTO
                   Plane028 = BACK
                   Plane029 = BACK
                ================================================= */

                if (

                    node.name === "Plane025" ||
                    node.name === "Plane026" ||
                    node.name === "Plane027" ||
                    node.name === "Plane028" ||
                    node.name === "Plane029"

                ) {


                    node.material =

                        new THREE.MeshStandardMaterial({

                            color:
                                0x000000,

                            metalness:
                                0.2,

                            roughness:
                                0.7

                        });

                }


                /* =================================================
                   PBR
                ================================================= */

                if (

                    node.name.startsWith(
                        "Cylinder"
                    )

                ) {


                    node.material =

                        new THREE.MeshStandardMaterial({

                            map:
                                originalMap,

                            color:
                                originalColor,

                            metalness:
                                0.85,

                            roughness:
                                0.25

                        });

                }


                /* =================================================
                   CEL SHADING
                ================================================= */

                if (

                    node.name.startsWith(
                        "Icosphere"
                    )

                ) {


                    node.material =

                        new THREE.MeshToonMaterial({

                            map:
                                originalMap,

                            color:
                                originalColor,

                            gradientMap:
                                toonGradientMap

                        });

                }


                /* =================================================
                   PLANE025
                   MENU
                ================================================= */

                if (

                    node.name ===
                    "Plane025"

                ) {

                    menuButtonObj =
                        node;

                }


                /* =================================================
                   PLANE026
                   ABOUT ME
                ================================================= */

                if (

                    node.name ===
                    "Plane026"

                ) {

                    aboutButtonObj =
                        node;

                }


                /* =================================================
                   PLANE027
                   PHOTO
                ================================================= */

                if (

                    node.name ===
                    "Plane027"

                ) {

                    photoButtonObj =
                        node;

                }


                /* =================================================
                   PLANE029
                   MENU BACK
                ================================================= */

                if (

                    node.name ===
                    "Plane029"

                ) {

                    menuTargetObj =
                        node;

                }


                /* =================================================
                   PLANE028
                   ABOUT BACK
                ================================================= */

                if (

                    node.name ===
                    "Plane028"

                ) {

                    aboutTargetObj =
                        node;

                }


                /* =================================================
                   PLANE024
                   PHOTO TARGET
                ================================================= */

                if (

                    node.name ===
                    "Plane024"

                ) {

                    photoTargetObj =
                        node;

                }


                /* =================================================
                   CURTAIN
                ================================================= */

                if (

                    CURTAIN_OBJECT_NAMES.includes(
                        node.name
                    )

                ) {


                    node.material.onBeforeCompile =

                        function (shader) {


                            shader.uniforms.uTime = {

                                value: 0

                            };


                            shader.vertexShader =

                                "uniform float uTime;\n" +

                                shader.vertexShader;


                            shader.vertexShader =

                                shader.vertexShader.replace(

                                    "#include <begin_vertex>",

                                    `

                                    #include <begin_vertex>

                                    float waveStrength = 0.04;

                                    float waveSpeed = 2.0;

                                    float waveFreq = 6.0;

                                    float hangFactor =

                                        clamp(

                                            1.0 -
                                            (position.y + 1.0),

                                            0.0,
                                            1.0

                                        );


                                    transformed.x +=

                                        sin(

                                            position.y *
                                            waveFreq +

                                            uTime *
                                            waveSpeed

                                        )

                                        *

                                        waveStrength

                                        *

                                        hangFactor;


                                    transformed.z +=

                                        cos(

                                            position.y *
                                            waveFreq *
                                            0.7 +

                                            uTime *
                                            waveSpeed

                                        )

                                        *

                                        waveStrength

                                        *

                                        0.5

                                        *

                                        hangFactor;

                                    `

                                );


                            curtainShaders.push(
                                shader
                            );

                        };


                    node.material.needsUpdate =
                        true;

                }

            }

        );


        /* ====================================================
           MODEL CENTER
        ==================================================== */

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        model.position.sub(
            center
        );


        /* ====================================================
           INITIAL CAMERA
        ==================================================== */

        const maxDim =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        const fov =
            camera.fov *
            Math.PI /
            180;


        let cameraZ =

            Math.abs(

                maxDim /

                (
                    2 *
                    Math.tan(
                        fov / 2
                    )
                )

            );


        cameraZ *= 1.35;


        camera.position.set(

            0,
            0,
            cameraZ

        );


        controls.target.set(

            0,
            0,
            0

        );


        controls.update();


        /* ====================================================
           SAVE DEFAULT CAMERA
        ==================================================== */

        defaultCamPos.copy(

            camera.position

        );


        defaultCamTarget.copy(

            controls.target

        );


        /* ====================================================
           ADD MODEL
        ==================================================== */

        scene.add(

            model

        );

    },


    undefined,


    function (error) {

        console.error(

            "โหลดโมเดลไม่สำเร็จ",

            error

        );

    }

);


/* ============================================================
   RAYCASTER
============================================================ */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


/* ============================================================
   LEFT CLICK
============================================================ */

renderer.domElement.addEventListener(

    "click",

    function (event) {


        if (!modelRoot) {

            return;

        }


        if (flyAnimation) {

            return;

        }


        mouse.x =

            (
                event.clientX /
                window.innerWidth
            ) * 2 - 1;


        mouse.y =

            -(
                event.clientY /
                window.innerHeight
            ) * 2 + 1;


        raycaster.setFromCamera(

            mouse,

            camera

        );


        const intersects =

            raycaster.intersectObject(

                modelRoot,

                true

            );


        if (

            intersects.length === 0

        ) {

            return;

        }


        const hit =
            intersects[0].object;


        /* ====================================================
           MENU

           Plane025 → Plane029
        ==================================================== */

        if (

            hit ===
            menuButtonObj

        ) {

            showMenu();

            return;

        }


        /* ====================================================
           ABOUT ME

           Plane026 → Plane028
        ==================================================== */

        if (

            hit ===
            aboutButtonObj

        ) {

            showAboutMe();

            return;

        }


        /* ====================================================
           PHOTO

           Plane027 → Plane024
        ==================================================== */

        if (

            hit ===
            photoButtonObj

        ) {

            showPhoto();

            return;

        }


        /* ====================================================
           MENU BACK

           Plane029
        ==================================================== */

        if (

            hit ===
            menuTargetObj

        ) {

            goBack();

            return;

        }


        /* ====================================================
           ABOUT BACK

           Plane028
        ==================================================== */

        if (

            hit ===
            aboutTargetObj

        ) {

            goBack();

            return;

        }

    }

);


/* ============================================================
   FOCUS OBJECT
============================================================ */

function focusOnObject(

    object,

    distance = 1.8

) {


    if (!object) {

        console.warn(
            "ไม่พบ Target Object"
        );

        return;

    }


    const box =
        new THREE.Box3()
            .setFromObject(
                object
            );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const maxDim =
        Math.max(

            size.x,
            size.y,
            size.z,
            0.1

        );


    const direction =
        new THREE.Vector3();


    direction.subVectors(

        camera.position,

        center

    );


    if (

        direction.lengthSq() <
        0.0001

    ) {

        direction.set(

            0,
            0,
            1

        );

    }


    direction.normalize();


    const targetCameraPosition =

        center.clone().add(

            direction.multiplyScalar(

                maxDim *
                distance

            )

        );


    flyCameraTo(

        targetCameraPosition,

        center,

        900

    );

}


/* ============================================================
   CAMERA FLY
============================================================ */

function flyCameraTo(

    targetPosition,

    targetLookAt,

    duration = 900

) {


    if (flyAnimation) {

        cancelAnimationFrame(

            flyAnimation

        );

    }


    const startPosition =
        camera.position.clone();


    const startTarget =
        controls.target.clone();


    const startTime =
        performance.now();


    controls.enabled =
        false;


    function animateCamera(now) {


        const progress =

            Math.min(

                (
                    now -
                    startTime
                ) /
                duration,

                1

            );


        const ease =

            progress < 0.5

                ?

                2 *
                progress *
                progress

                :

                1 -

                Math.pow(

                    -2 *
                    progress +
                    2,

                    2

                ) / 2;


        camera.position.lerpVectors(

            startPosition,

            targetPosition,

            ease

        );


        controls.target.lerpVectors(

            startTarget,

            targetLookAt,

            ease

        );


        camera.lookAt(

            controls.target

        );


        if (

            progress < 1

        ) {


            flyAnimation =

                requestAnimationFrame(

                    animateCamera

                );

        }

        else {


            camera.position.copy(

                targetPosition

            );


            controls.target.copy(

                targetLookAt

            );


            camera.lookAt(

                targetLookAt

            );


            controls.enabled =
                true;


            flyAnimation =
                null;

        }

    }


    flyAnimation =

        requestAnimationFrame(

            animateCamera

        );

}


/* ============================================================
   MENU
============================================================ */

function showMenu() {


    viewingMode =
        true;


    currentPage =
        "menu";


    focusOnObject(

        menuTargetObj,

        2.0

    );

}


/* ============================================================
   ABOUT ME
============================================================ */

function showAboutMe() {


    viewingMode =
        true;


    currentPage =
        "about";


    focusOnObject(

        aboutTargetObj,

        2.0

    );

}


/* ============================================================
   PHOTO
============================================================ */

function showPhoto() {


    viewingMode =
        true;


    currentPage =
        "photo";


    focusOnObject(

        photoTargetObj,

        1.8

    );

}


/* ============================================================
   GO BACK
============================================================ */

function goBack() {


    viewingMode =
        false;


    currentPage =
        null;


    controls.enabled =
        false;


    flyCameraTo(

        defaultCamPos,

        defaultCamTarget,

        900

    );

}


/* ============================================================
   ANIMATION LOOP
============================================================ */

function animate() {


    requestAnimationFrame(

        animate

    );


    /* ========================================================
       Orbit Controls

       คลิกซ้ายลาก = หมุน
       Scroll = Zoom
    ======================================================== */

    if (

        controls.enabled

    ) {

        controls.update();

    }


    /* ========================================================
       CURTAIN ANIMATION
    ======================================================== */

    const time =
        clock.getElapsedTime();


    curtainShaders.forEach(

        function (shader) {


            shader.uniforms.uTime.value =
                time;

        }

    );


    /* ========================================================
       RENDER
    ======================================================== */

    renderer.render(

        scene,

        camera

    );

}


animate();


/* ============================================================
   WINDOW RESIZE
============================================================ */

window.addEventListener(

    "resize",

    function () {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>

</body>

</html>
