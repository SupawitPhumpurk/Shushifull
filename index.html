<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Model - Shushi</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #1a1a1a;
        }

        canvas {

            display: block;

            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>


<script>

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x1a1a1a);


    // =========================================================
    // CAMERA
    // =========================================================

    const camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );


    // =========================================================
    // RENDERER
    // =========================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    document.body.appendChild(
        renderer.domElement
    );


    // =========================================================
    // ORBIT CONTROLS
    // =========================================================

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );


    // เปิดการหมุน
    controls.enableRotate = true;


    // เปิดซูม
    controls.enableZoom = true;


    // ปิดการเลื่อน
    controls.enablePan = false;


    // หมุนด้วยเมาส์ซ้าย
    controls.mouseButtons.LEFT =
        THREE.MOUSE.ROTATE;


    // ปิดปุ่มขวา
    controls.mouseButtons.RIGHT =
        THREE.MOUSE.PAN;


    // หมุนรอบแนวตั้งได้เต็ม
    controls.minPolarAngle = 0.05;

    controls.maxPolarAngle =
        Math.PI - 0.05;


    // หมุนซ้ายขวาได้เต็ม 360
    controls.minAzimuthAngle = -Infinity;

    controls.maxAzimuthAngle = Infinity;


    // ความเร็วหมุน
    controls.rotateSpeed = 0.8;


    // ความเร็วซูม
    controls.zoomSpeed = 1.0;


    // Smooth
    controls.enableDamping = true;

    controls.dampingFactor = 0.08;


    // =========================================================
    // LIGHT
    // =========================================================

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            1.0
        );

    scene.add(ambientLight);


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );


    directionalLight.position.set(
        0,
        10,
        10
    );


    scene.add(
        directionalLight
    );


    // =========================================================
    // TOON GRADIENT
    // =========================================================

    const gradientMap =
        new THREE.DataTexture(
            new Uint8Array([
                80, 80, 80,
                140, 140, 140,
                190, 190, 190,
                255, 255, 255
            ]),
            4,
            1,
            THREE.RGBFormat
        );


    gradientMap.needsUpdate = true;


    // =========================================================
    // VARIABLES
    // =========================================================

    let model = null;


    let menuButton = null;

    let aboutButton = null;

    let photoButton = null;


    let menuBackButton = null;

    let aboutBackButton = null;


    let currentPage = "home";


    // =========================================================
    // CAMERA DEFAULT
    // =========================================================

    let defaultCamPos =
        new THREE.Vector3(
            0,
            4,
            12
        );


    let defaultCamTarget =
        new THREE.Vector3(
            0,
            2,
            0
        );


    let targetCameraPosition =
        defaultCamPos.clone();


    let targetCameraTarget =
        defaultCamTarget.clone();


    camera.position.copy(
        defaultCamPos
    );


    controls.target.copy(
        defaultCamTarget
    );


    // =========================================================
    // FOCUS CAMERA
    // =========================================================

    function focusObject(object) {

        if (!object) return;


        const box =
            new THREE.Box3()
                .setFromObject(object);


        const center =
            new THREE.Vector3();


        box.getCenter(center);


        const size =
            new THREE.Vector3();


        box.getSize(size);


        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /*
         * ตำแหน่งกล้องจะอยู่ด้านหน้าของ Object
         * แต่ยังสามารถ Orbit รอบ Object ได้
         */

        const distance =
            Math.max(
                maxSize * 2.5,
                4
            );


        targetCameraTarget.copy(
            center
        );


        targetCameraPosition.set(
            center.x,
            center.y + maxSize * 0.3,
            center.z + distance
        );

    }


    // =========================================================
    // GO HOME
    // =========================================================

    function goBack() {

        currentPage = "home";


        targetCameraPosition.copy(
            defaultCamPos
        );


        targetCameraTarget.copy(
            defaultCamTarget
        );

    }


    // =========================================================
    // SHOW MENU
    // =========================================================

    function showMenu() {

        currentPage = "menu";


        const target =
            model.getObjectByName(
                "Plane016"
            );


        if (target) {

            focusObject(target);

        }

    }


    // =========================================================
    // SHOW ABOUT
    // =========================================================

    function showAbout() {

        currentPage = "about";


        const target =
            model.getObjectByName(
                "Plane017"
            );


        if (target) {

            focusObject(target);

        }

    }


    // =========================================================
    // SHOW PHOTO
    // =========================================================

    function showPhoto() {

        currentPage = "photo";


        const target =
            model.getObjectByName(
                "Plane024"
            );


        if (target) {

            focusObject(target);

        }

    }


    // =========================================================
    // OBJECT / CHILD CHECK
    // =========================================================

    function isObjectOrChild(
        object,
        target
    ) {

        if (!object || !target) {

            return false;

        }


        let current =
            object;


        while (current) {

            if (
                current === target
            ) {

                return true;

            }


            current =
                current.parent;

        }


        return false;

    }


    // =========================================================
    // MAKE BLACK BUTTON
    // =========================================================

    function makeBackButtonBlack(
        object
    ) {

        if (!object) return;


        object.traverse(
            function (child) {

                if (!child.isMesh) {

                    return;

                }


                child.material =
                    new THREE.MeshStandardMaterial({

                        color: 0x000000,

                        metalness: 0,

                        roughness: 0.8,

                        side:
                            THREE.DoubleSide,

                        transparent: false,

                        opacity: 1

                    });

            }
        );

    }


    // =========================================================
    // LOAD MODEL
    // =========================================================

    const loader =
        new THREE.GLTFLoader();


    // =========================================================
    // DRACO
    // =========================================================

    const dracoLoader =
        new THREE.DRACOLoader();


    dracoLoader.setDecoderPath(
        "https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    );


    loader.setDRACOLoader(
        dracoLoader
    );


    // =========================================================
    // LOAD GLB
    // =========================================================

    loader.load(

        "https://supawitphumpurk.github.io/Shushifull/Shushi.glb?v=3",

        function (gltf) {

            model =
                gltf.scene;


            scene.add(
                model
            );


            // =================================================
            // AUTO CENTER MODEL
            // =================================================

            const box =
                new THREE.Box3()
                    .setFromObject(model);


            const center =
                new THREE.Vector3();


            box.getCenter(center);


            const size =
                new THREE.Vector3();


            box.getSize(size);


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            // =================================================
            // DEFAULT CAMERA
            // =================================================

            defaultCamTarget.copy(
                center
            );


            defaultCamPos.set(
                center.x,
                center.y + maxSize * 0.35,
                center.z + maxSize * 2.2
            );


            camera.position.copy(
                defaultCamPos
            );


            controls.target.copy(
                defaultCamTarget
            );


            targetCameraPosition.copy(
                defaultCamPos
            );


            targetCameraTarget.copy(
                defaultCamTarget
            );


            // =================================================
            // FIND BUTTONS
            // =================================================

            model.traverse(
                function (node) {


                    // -----------------------------------------
                    // MAIN BUTTONS
                    // -----------------------------------------

                    if (
                        node.name === "Plane025"
                    ) {

                        menuButton =
                            node;

                    }


                    if (
                        node.name === "Plane026"
                    ) {

                        aboutButton =
                            node;

                    }


                    if (
                        node.name === "Plane027"
                    ) {

                        photoButton =
                            node;

                    }


                    // -----------------------------------------
                    // ABOUT BACK
                    // Plane.028
                    // -----------------------------------------

                    if (
                        node.name === "Plane.028" ||
                        node.name === "Plane028"
                    ) {

                        aboutBackButton =
                            node;

                    }


                    // -----------------------------------------
                    // MENU BACK
                    // Plane.030
                    // -----------------------------------------

                    if (
                        node.name === "Plane.030" ||
                        node.name === "Plane030"
                    ) {

                        menuBackButton =
                            node;

                    }


                    // -----------------------------------------
                    // MATERIAL
                    // -----------------------------------------

                    if (!node.isMesh) {

                        return;

                    }


                    // -----------------------------------------
                    // BACK BUTTON BLACK
                    // -----------------------------------------

                    if (
                        node.name === "Plane.028" ||
                        node.name === "Plane028" ||
                        node.name === "Plane.030" ||
                        node.name === "Plane030"
                    ) {

                        node.material =
                            new THREE.MeshStandardMaterial({

                                color: 0x000000,

                                metalness: 0,

                                roughness: 0.8,

                                side:
                                    THREE.DoubleSide

                            });


                        return;

                    }


                    // -----------------------------------------
                    // CYLINDER PBR
                    // -----------------------------------------

                    if (
                        node.name.startsWith(
                            "Cylinder"
                        )
                    ) {

                        const oldMaterial =
                            node.material;


                        node.material =
                            new THREE.MeshStandardMaterial({

                                map:
                                    oldMaterial?.map ||
                                    null,

                                color:
                                    oldMaterial?.color ||
                                    new THREE.Color(
                                        0xffffff
                                    ),

                                metalness: 0.85,

                                roughness: 0.25,

                                side:
                                    THREE.DoubleSide

                            });

                    }


                    // -----------------------------------------
                    // ICOSPHERE TOON
                    // -----------------------------------------

                    if (
                        node.name.startsWith(
                            "Icosphere"
                        )
                    ) {

                        const oldMaterial =
                            node.material;


                        node.material =
                            new THREE.MeshToonMaterial({

                                map:
                                    oldMaterial?.map ||
                                    null,

                                color:
                                    oldMaterial?.color ||
                                    new THREE.Color(
                                        0xffffff
                                    ),

                                gradientMap:
                                    gradientMap,

                                side:
                                    THREE.DoubleSide

                            });

                    }


                    // -----------------------------------------
                    // VERTEX SHADER
                    // -----------------------------------------

                    if (
                        node.name === "Plane011"
                    ) {

                        node.material =
                            node.material.clone();


                        node.material.onBeforeCompile =
                            function (shader) {

                                shader.uniforms.uTime = {
                                    value: 0
                                };


                                shader.vertexShader =
                                    shader.vertexShader.replace(

                                        "#include <begin_vertex>",

                                        `
                                        #include <begin_vertex>

                                        float wave =
                                            sin(
                                                transformed.y * 2.0
                                                +
                                                uTime * 1.5
                                            )
                                            * 0.08;

                                        transformed.x += wave;
                                        transformed.z += wave;
                                        `
                                    );


                                node.userData.shader =
                                    shader;

                            };


                        node.userData.isCurtain =
                            true;

                    }

                }
            );


            // =================================================
            // MAKE BACK BUTTONS BLACK
            // =================================================

            makeBackButtonBlack(
                aboutBackButton
            );


            makeBackButtonBlack(
                menuBackButton
            );


            // =================================================
            // DEBUG
            // =================================================

            console.log(
                "Plane025 MENU =",
                menuButton
            );

            console.log(
                "Plane026 ABOUT =",
                aboutButton
            );

            console.log(
                "Plane027 PHOTO =",
                photoButton
            );

            console.log(
                "Plane.028 ABOUT BACK =",
                aboutBackButton
            );

            console.log(
                "Plane.030 MENU BACK =",
                menuBackButton
            );

        },

        undefined,

        function (error) {

            console.error(
                "โหลดโมเดลไม่ได้:",
                error
            );

        }

    );


    // =========================================================
    // RAYCASTER
    // =========================================================

    const raycaster =
        new THREE.Raycaster();


    const mouse =
        new THREE.Vector2();


    // =========================================================
    // CLICK
    // =========================================================

    renderer.domElement.addEventListener(
        "click",
        function (event) {

            if (!model) return;


            const rect =
                renderer.domElement
                    .getBoundingClientRect();


            mouse.x =
                (
                    (event.clientX -
                        rect.left)
                    /
                    rect.width
                ) * 2 - 1;


            mouse.y =
                -(
                    (event.clientY -
                        rect.top)
                    /
                    rect.height
                ) * 2 + 1;


            raycaster.setFromCamera(
                mouse,
                camera
            );


            const intersects =
                raycaster.intersectObject(
                    model,
                    true
                );


            if (
                intersects.length === 0
            ) {

                return;

            }


            // =================================================
            // BACK BUTTON FIRST
            // =================================================

            for (
                let i = 0;
                i < intersects.length;
                i++
            ) {

                const hit =
                    intersects[i].object;


                // -----------------------------------------
                // Plane.030
                // -----------------------------------------

                if (
                    menuBackButton &&
                    isObjectOrChild(
                        hit,
                        menuBackButton
                    )
                ) {

                    goBack();

                    return;

                }


                // -----------------------------------------
                // Plane.028
                // -----------------------------------------

                if (
                    aboutBackButton &&
                    isObjectOrChild(
                        hit,
                        aboutBackButton
                    )
                ) {

                    goBack();

                    return;

                }

            }


            // =================================================
            // MAIN BUTTONS
            // =================================================

            for (
                let i = 0;
                i < intersects.length;
                i++
            ) {

                const hit =
                    intersects[i].object;


                // MENU
                if (
                    menuButton &&
                    isObjectOrChild(
                        hit,
                        menuButton
                    )
                ) {

                    showMenu();

                    return;

                }


                // ABOUT
                if (
                    aboutButton &&
                    isObjectOrChild(
                        hit,
                        aboutButton
                    )
                ) {

                    showAbout();

                    return;

                }


                // PHOTO
                if (
                    photoButton &&
                    isObjectOrChild(
                        hit,
                        photoButton
                    )
                ) {

                    showPhoto();

                    return;

                }

            }

        }
    );


    // =========================================================
    // ANIMATION
    // =========================================================

    const clock =
        new THREE.Clock();


    function animate() {

        requestAnimationFrame(
            animate
        );


        const elapsed =
            clock.getElapsedTime();


        // ---------------------------------------------
        // Smooth camera
        // ---------------------------------------------

        camera.position.lerp(
            targetCameraPosition,
            0.08
        );


        controls.target.lerp(
            targetCameraTarget,
            0.08
        );


        // สำคัญมาก
        // OrbitControls ต้อง update ทุกเฟรม

        controls.update();


        // ---------------------------------------------
        // Vertex animation
        // ---------------------------------------------

        if (model) {

            model.traverse(
                function (node) {

                    if (
                        node.userData &&
                        node.userData.shader
                    ) {

                        node.userData.shader
                            .uniforms
                            .uTime
                            .value =
                            elapsed;

                    }

                }
            );

        }


        renderer.render(
            scene,
            camera
        );

    }


    animate();


    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
        "resize",
        function () {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );


    // =========================================================
    // DISABLE RIGHT CLICK
    // =========================================================

    renderer.domElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

        }
    );

</script>

</body>
</html>
